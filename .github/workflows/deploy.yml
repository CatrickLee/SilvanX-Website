name: Deploy SilvanX Static Website

# WHEN TO RUN: Trigger this workflow on every push to the 'main' branch
on:
  push:
    branches:
      - main

# Configure job-level permissions for OIDC
permissions:
  id-token: write # Required for OIDC authentication
  contents: read # Required to checkout the code

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # ✅ SECURE: Replacing hardcoded ARN with the GH_OIDC_ROLE_ARN secret
          role-to-assume: ${{ secrets.GH_OIDC_ROLE_ARN }} 
          
          # ✅ SECURE: Replacing hardcoded region with the AWS_REGION secret
          aws-region: ${{ secrets.AWS_REGION }} 

      - name: Deploy files to S3 (Sync)
        # ✅ SECURE: Replacing hardcoded bucket name with the S3_BUCKET_NAME secret
        run: aws s3 sync . s3://${{ secrets.S3_BUCKET_NAME }} --acl bucket-owner-full-control --delete
        
        # '--delete' removes files from S3 if they were deleted from the repo.

      - name: Invalidate CloudFront Cache
        # ✅ SECURE: Replacing hardcoded Distribution ID with the CF_DISTRIBUTION_ID secret
        run: aws cloudfront create-invalidation --distribution-id ${{ secrets.CF_DISTRIBUTION_ID }} --paths "/*"